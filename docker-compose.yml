services:
  postgres:
    image: postgres:16
    container_name: cinema-postgres
    environment:
      POSTGRES_DB: cinemadb
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - cinema-pg-data:/var/lib/postgresql/data

volumes:
  cinema-pg-data:
